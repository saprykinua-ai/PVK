; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.partitions = huge_app2.csv
upload_speed = 921600
upload_port = com3
extra_scripts = pre:renamePVK.py
build_flags = 
     -DELEGANTOTA_USE_ASYNC_WEBSERVER=1      # чтобы очистить лог компиляции от лишних предупреждений
	 -DCONFIG_LWIP_TCP_OVERSIZE_MSS=1        # избежать проблем с фрагментацией данных при передаче больших файлов (прошивки) по HTTP
	 -DCONFIG_LWIP_DHCP_COARSE_TIMER_SECS=60
     -D ARDUINO_USB_CDC_ON_BOOT=0           # 0 - не ждать соединения при загрузке
     -D ARDUINO_USB_MODE=1                  # добавил для порта

    # -DELEGANTOTA_USE_ASYNC_WEBSERVER=1      # Это заставит библиотеку использовать асинхронный веб-сервер
   # -std=c++11
lib_deps = 
    mathieucarbou/ESPAsyncWebServer @ 3.6.0
	mathieucarbou/AsyncTCP @ 3.3.2
	ayushsharma82/ElegantOTA @ 3.1.6
	arduino-libraries/NTPClient@^3.2.1
    milesburton/DallasTemperature @ 3.11.0	
    bblanchon/ArduinoJson @ 7.4.2

	#ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	#milesburton/DallasTemperature@^3.9.0
	#ayushsharma82/AsyncElegantOTA@^2.2.7

	# Windows, symbolic link
    D:/Program Produkt/VisualCode/Library/my_lib	
